<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamoor Shahzad | Premium Web Developer</title>
    <meta name="description" content="Tamoor Shahzad - Exclusive Web Developer & MERN Stack Developer. Building premium digital experiences.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            /* Ultra Modern Attractive Cyan & Purple */
            --bg-color: #030303; 
            --card-glass: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.07);
            
            --text-primary: #ffffff;
            --text-secondary: #8a8f98;
            
            /* Neon Aesthetic */
            --theme-primary: #00f2fe; /* Cyan */
            --theme-secondary: #4facfe; /* Blue/Purple */
            --theme-glow: rgba(0, 242, 254, 0.25);
            
            /* Clean Brand Accents */
            --color-whatsapp: #25D366;
            --color-linkedin: #0A66C2;
            --color-github: #ffffff;
            --color-portfolio: var(--theme-primary);
            --color-tiktok: #ffffff; 
            --color-email: #ea4335;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 2rem 1rem;
        }

        /* Ambient Background Glow */
        .ambient-glow-1 {
            position: fixed;
            width: 50vw;
            height: 50vw;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.08), transparent 60%);
            filter: blur(100px);
            opacity: 0.8;
            z-index: 0;
            animation: floatGlow 15s ease-in-out infinite alternate;
            pointer-events: none;
            top: 20%;
            left: 10%;
        }

        .ambient-glow-2 {
            position: fixed;
            width: 40vw;
            height: 40vw;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(79, 172, 254, 0.08), transparent 60%);
            filter: blur(100px);
            opacity: 0.8;
            z-index: 0;
            animation: floatGlow 12s ease-in-out infinite alternate-reverse;
            pointer-events: none;
            bottom: 10%;
            right: 10%;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        /* Main Card Container */
        .profile-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 580px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-card {
            background: var(--card-glass);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--card-border);
            border-top: 1px solid rgba(255, 255, 255, 0.15); /* Clean sleek highlight */
            border-radius: 32px;
            padding: 4rem 3.5rem;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 60px -10px rgba(0, 0, 0, 0.8), 
                        inset 0 1px 1px rgba(255, 255, 255, 0.05);
            transition: box-shadow 0.6s ease, transform 0.6s ease;
            opacity: 0;
            transform: translateY(40px);
            animation: cardReveal 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            position: relative;
        }

        .profile-card:hover {
            box-shadow: 0 40px 80px -10px rgba(0, 0, 0, 0.9), 
                        0 0 40px var(--theme-glow),
                        inset 0 1px 1px rgba(0, 242, 254, 0.2);
            transform: translateY(-5px);
            border-color: rgba(0, 242, 254, 0.3);
        }

        @keyframes cardReveal {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Profile Image */
        .profile-img-container {
            width: 250px;
            height: 330px;
            margin: 0 auto 3.5rem auto;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6),
                        0 0 0 1px rgba(255, 255, 255, 0.08); /* crisp white outline */
            opacity: 0;
            animation: fadeIn 1.2s ease 0.4s forwards;
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* Electric Lighting Gleam Overlay */
        .profile-img-container::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; 
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(0, 242, 254, 0.6), transparent);
            transform: skewX(-25deg);
            pointer-events: none;
            z-index: 2;
        }

        .profile-img-container:hover {
            box-shadow: 0 30px 60px rgba(0,0,0,0.8),
                        0 0 0 2px var(--theme-primary), /* Electric Cyan Border */
                        0 0 30px var(--theme-glow); 
            transform: translateY(-10px);
        }

        .profile-img-container:hover::after {
            animation: shineSweep 1.2s ease-in-out;
        }

        @keyframes shineSweep { 
            0% { left: -100%; } 
            100% { left: 200%; }
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.8s ease;
            filter: contrast(1.05) brightness(0.9) saturate(0.7); /* Sleek high-contrast modern start */
        }

        .profile-img-container:hover .profile-img {
            transform: scale(1.08);
            filter: contrast(1.1) brightness(1.05) saturate(1.1); 
        }

        /* Text Content */
        .profile-name {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: -1.5px;
            margin-bottom: 0.6rem;
            color: var(--text-primary);
            text-shadow: 0 10px 30px rgba(255, 255, 255, 0.2);
            opacity: 0;
            animation: slideUp 0.8s ease 0.6s forwards;
        }

        .profile-headline {
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 5px;
            
            /* Gradient Text */
            background: linear-gradient(135deg, var(--theme-primary), var(--theme-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            margin-bottom: 1.5rem;
            opacity: 0;
            animation: slideUp 0.8s ease 0.7s forwards;
        }

        .profile-bio {
            font-size: 1.05rem;
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 3.5rem;
            padding: 0 1.5rem;
            opacity: 0;
            animation: slideUp 0.8s ease 0.8s forwards;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        /* Social Icons */
        .social-links {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 0.5rem;
            flex-wrap: nowrap; /* Force single row */
            opacity: 0;
            animation: slideUp 0.8s ease 0.9s forwards;
            width: 100%;
        }

        .social-icon {
            display: flex;
            flex-direction: column; /* icon on top, label below */
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.9rem 0.5rem 0.7rem;
            width: 72px; /* fixed equal width for all 6 tiles to fit */
            min-width: 0;
            border-radius: 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            font-size: 1.3rem;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }
        
        .social-icon svg {
            position: relative;
            z-index: 1;
            flex-shrink: 0;
        }
        
        .social-icon span {
            position: relative;
            z-index: 1;
            font-size: 0.6rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        /* Default Brand Colors */
        .social-icon.whatsapp { color: var(--color-whatsapp); border-color: rgba(37, 211, 102, 0.2); }
        .social-icon.linkedin { color: var(--color-linkedin); border-color: rgba(10, 102, 194, 0.2); }
        .social-icon.github { color: var(--color-github); }
        .social-icon.portfolio { color: var(--color-portfolio); border-color: rgba(0, 242, 254, 0.2); }
        .social-icon.tiktok { color: var(--color-tiktok); border-color: rgba(255, 255, 255, 0.2); } 
        .social-icon.email { color: var(--color-email); border-color: rgba(234, 67, 53, 0.2); }

        /* Modern Hover States for Buttons */
        .social-icon:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08); 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
        }
        .social-icon:hover span { color: var(--text-primary); }

        .social-icon.whatsapp:hover { border-color: var(--color-whatsapp); box-shadow: 0 10px 25px -5px rgba(37, 211, 102, 0.4); }
        .social-icon.linkedin:hover { border-color: var(--color-linkedin); box-shadow: 0 10px 25px -5px rgba(10, 102, 194, 0.4); }
        .social-icon.github:hover { border-color: var(--color-github); box-shadow: 0 10px 25px -5px rgba(255, 255, 255, 0.3); }
        .social-icon.portfolio:hover { border-color: var(--color-portfolio); box-shadow: 0 10px 25px -5px var(--theme-glow); }
        .social-icon.tiktok:hover { border-color: #ff0050; box-shadow: 0 10px 25px -5px rgba(255, 0, 80, 0.4); }
        .social-icon.email:hover { border-color: var(--color-email); box-shadow: 0 10px 25px -5px rgba(234, 67, 53, 0.4); }

        /* Footer */
        .footer-text {
            font-size: 0.75rem;
            color: rgba(255,255,255, 0.3);
            margin-top: 3.5rem;
            letter-spacing: 1px;
            opacity: 0;
            animation: fadeIn 1s ease 1s forwards;
            text-align: center;
        }

        /* Keyframes */
        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Adjustments */
        @media (max-width: 576px) {
            .profile-card {
                padding: 3.5rem 2rem;
                border-radius: 24px;
            }

            .profile-img-container {
                width: 100%;
                max-width: 240px;
                height: 310px;
                /* Lock the hover state ON for mobile */
                box-shadow: 0 25px 50px rgba(0,0,0,0.8),
                            0 0 0 2px var(--theme-primary),
                            0 0 25px var(--theme-glow);
                transform: translateY(-5px);
            }
            
            .profile-img-container::after {
                /* Continuous subtle shine on mobile */
                animation: shineSweep 4s infinite ease-in-out;
            }
            
            .profile-img-container .profile-img {
                transform: scale(1.05);
                filter: contrast(1.1) brightness(1.05) saturate(1.1);
            }

            .profile-name { font-size: 2.3rem; letter-spacing: -1px; }
            .profile-headline { font-size: 0.8rem; letter-spacing: 4px; }
            
            .social-links { gap: 0.3rem; }

            .social-icon {
                width: 52px;
                padding: 0.7rem 0.3rem 0.5rem;
                font-size: 1.1rem;
                border-radius: 12px;
            }
            
            .social-icon span { font-size: 0.55rem; }
        }
    </style>
</head>

    <!-- Bootstrap JS for Tooltips -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Subtle 3D lift effect on mouse move for the VIP card
            const card = document.getElementById('profileCard');
            
            document.addEventListener('mousemove', (e) => {
                if(window.innerWidth < 768) return;
                
                const xAxis = (window.innerWidth / 2 - e.pageX) / 75; 
                const yAxis = (window.innerHeight / 2 - e.pageY) / 75;
                
                card.style.transform = `perspective(1200px) rotateY(${xAxis}deg) rotateX(${yAxis}deg) translateY(-5px)`;
            });
            
            document.addEventListener('mouseleave', () => {
                if(window.innerWidth < 768) return;
                card.style.transform = `perspective(1200px) rotateY(0deg) rotateX(0deg) translateY(0px)`;
            });
        });
    </script>
